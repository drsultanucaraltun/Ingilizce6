:root{
  color-scheme: light;
  --olcek: 1;
  --zemin:#f1ece2; --panel:#ffffff; --metin:#1b2a3a; --ikincil:#46576a; --cizgi:#d6cfc1;
  --lacivert:#1d3557; --lacivert2:#2b4a73; --birincil:#1d6f5f; --birincil-k:#155447;
  --vurgu:#d9692a; --basari:#2e7d4f; --hata:#b3261e; --deniz:#3d7ea6; --rihtim:#ddd5c5;
  --k-hareket:#2a7f9e; --t-hareket:#e3f1f6;
  --k-eylem:#c1621f;   --t-eylem:#fbebdd;
  --k-dongu:#6b4fa0;   --t-dongu:#eee8f7;
  --k-karar:#2f5fb3;   --t-karar:#e5ecf9;
  --k-deg:#2e7d4f;     --t-deg:#e3f3e8;
  --golge:0 0.15rem 0.6rem rgba(29,53,87,.12);
  --r:0.8rem;
}
html{font-size:calc(clamp(15px, 0.55vw + 0.75vh + 4px, 22px) * var(--olcek));}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;max-width:100%;overflow:hidden;}
body{font-family:'Roboto',Arial,Helvetica,sans-serif;font-weight:300;color:var(--metin);background:var(--zemin);
  line-height:1.35;-webkit-text-size-adjust:100%;overflow-x:hidden;}
button{font-family:inherit;font-weight:400;font-size:1rem;color:inherit;touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;cursor:pointer;}
button:disabled{cursor:not-allowed;opacity:.5;}
:focus-visible{outline:0.22rem solid var(--vurgu);outline-offset:0.12rem;}
h1[tabindex="-1"]:focus,h2[tabindex="-1"]:focus,#ekran:focus{outline:none;}
h1,h2,h3{font-weight:700;margin:0;line-height:1.2;}
p{margin:0;}
svg{display:block;}
.gizli{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
[hidden]{display:none!important;}

/* ---------- Ana çerçeve ---------- */
#uygulama{display:grid;grid-template-rows:auto minmax(0,1fr) auto;height:100vh;height:100dvh;width:100%;max-width:100%;overflow:hidden;}
.ust{display:flex;align-items:center;gap:0.6rem;padding:0.45rem clamp(0.4rem,1.2vw,1rem);background:var(--lacivert);color:#fff;min-width:0;}
.arac-cubugu{display:flex;gap:0.35rem;flex:0 0 auto;}
.ust-dugme{min-width:44px;min-height:44px;width:2.6rem;height:2.6rem;border-radius:0.6rem;border:0.12rem solid rgba(255,255,255,.55);
  background:var(--lacivert2);color:#fff;display:inline-flex;align-items:center;justify-content:center;padding:0;font-weight:700;font-size:1.05rem;}
.ust-dugme svg{width:1.35rem;height:1.35rem;}
.ust-dugme[aria-pressed="true"]{background:#fff;color:var(--lacivert);}
.ust-baslik{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;}
.ust-baslik strong{font-size:1.2rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ust-baslik span{font-size:0.9rem;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bolumler-dugme{min-height:44px;padding:0.3rem 0.9rem;border-radius:0.6rem;border:0.12rem solid rgba(255,255,255,.55);background:var(--lacivert2);color:#fff;
  display:inline-flex;align-items:center;gap:0.4rem;flex:0 0 auto;}
.bolumler-dugme svg{width:1.3rem;height:1.3rem;}

main#ekran{min-height:0;min-width:0;overflow:hidden;padding:clamp(0.35rem,1vw,0.8rem);}
.alt{display:flex;align-items:center;gap:0.6rem;padding:0.45rem clamp(0.4rem,1.2vw,1rem);background:#fff;border-top:0.1rem solid var(--cizgi);min-width:0;}
.gezinti{min-width:44px;min-height:44px;padding:0.45rem 1.1rem;border-radius:0.7rem;font-size:1.15rem;font-weight:700;
  display:inline-flex;align-items:center;gap:0.45rem;flex:0 0 auto;border:0.14rem solid var(--lacivert);}
.gezinti svg{width:1.4rem;height:1.4rem;}
#geriDugme{background:#fff;color:var(--lacivert);}
#ileriDugme{background:var(--lacivert);color:#fff;margin-left:auto;}
#ileriDugme.dikkat{background:var(--basari);border-color:var(--basari);animation:nabiz 1.4s ease-in-out infinite;}
@keyframes nabiz{0%,100%{box-shadow:0 0 0 0 rgba(46,125,79,.5);}50%{box-shadow:0 0 0 0.45rem rgba(46,125,79,0);}}
#durum{flex:1 1 auto;min-width:0;text-align:center;font-size:1.05rem;font-weight:400;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
#durum.iyi{color:var(--basari);} #durum.kotu{color:var(--hata);}

/* ---------- Genel paneller ---------- */
.panel{background:var(--panel);border-radius:var(--r);box-shadow:var(--golge);display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;}
.panel-baslik{display:flex;align-items:center;justify-content:space-between;gap:0.4rem;padding:0.55rem 0.8rem;border-bottom:0.1rem solid var(--cizgi);flex:0 0 auto;}
.panel-baslik h2{font-size:1.1rem;}
.panel-baslik small{font-size:0.9rem;color:var(--ikincil);font-weight:400;}
.kaydir{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;min-height:0;}
.dugme{min-height:44px;min-width:44px;padding:0.45rem 0.9rem;border-radius:0.65rem;border:0.13rem solid var(--lacivert);background:#fff;color:var(--lacivert);
  display:inline-flex;align-items:center;justify-content:center;gap:0.4rem;font-size:1.02rem;}
.dugme svg{width:1.25rem;height:1.25rem;flex:0 0 auto;}
.dugme.birincil{background:var(--birincil);border-color:var(--birincil);color:#fff;}
.dugme.birincil.durdur{background:var(--hata);border-color:var(--hata);}

/* ---------- Giriş ---------- */
.giris{height:100%;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(0.6rem,2vw,1.6rem);align-items:center;max-width:76rem;margin:0 auto;}
.giris-metin{display:flex;flex-direction:column;gap:0.8rem;min-width:0;}
.giris-metin h1{font-size:clamp(1.8rem,3.4vw,3rem);color:var(--lacivert);}
.giris-metin p{font-size:1.2rem;}
.giris-gorsel{min-width:0;max-height:100%;display:flex;align-items:center;justify-content:center;}
.giris-gorsel img{display:block;width:100%;height:auto;max-height:60vh;object-fit:contain;border-radius:var(--r);box-shadow:var(--golge);}
.lejant{display:flex;flex-wrap:wrap;gap:0.5rem 1rem;margin-top:0.3rem;}
.lejant span{display:inline-flex;align-items:center;gap:0.4rem;font-size:1rem;}
.lejant i{width:3rem;height:2.2rem;display:inline-block;flex:0 0 auto;background-size:contain;background-repeat:no-repeat;background-position:center;}

/* ---------- Bölüm haritası ---------- */
.harita{height:100%;display:flex;flex-direction:column;gap:0.6rem;min-height:0;}
.harita h1{font-size:1.5rem;color:var(--lacivert);}
.bolum-izgara{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,15rem),1fr));gap:0.6rem;min-height:0;padding:0.15rem;}
.bolum-kart{text-align:left;min-height:44px;border-radius:var(--r);border:0.14rem solid var(--cizgi);background:#fff;padding:0.7rem 0.9rem;
  display:flex;flex-direction:column;gap:0.25rem;box-shadow:var(--golge);border-left:0.55rem solid var(--renk,#2a7f9e);}
.bolum-kart .no{font-size:0.95rem;color:var(--ikincil);}
.bolum-kart strong{font-size:1.25rem;font-weight:700;}
.bolum-kart .kavram{font-size:1rem;font-weight:300;}
.ilerleme{display:flex;gap:0.3rem;align-items:center;margin-top:0.2rem;font-size:0.95rem;}
.ilerleme i{width:0.9rem;height:0.9rem;border-radius:50%;border:0.12rem solid var(--basari);display:inline-block;}
.ilerleme i.tamam{background:var(--basari);}

/* ---------- Görev ekranı ---------- */
.gorev{display:grid;height:100%;gap:clamp(0.35rem,0.9vw,0.75rem);min-height:0;
  grid-template-columns:minmax(0,1fr) minmax(0,1.8fr) minmax(0,1.15fr);grid-template-areas:"sol orta sag";grid-template-rows:minmax(0,1fr);}
.alan-sol{grid-area:sol;display:flex;flex-direction:column;gap:clamp(0.35rem,0.9vw,0.75rem);min-height:0;min-width:0;}
.alan-orta{grid-area:orta;} .alan-sag{grid-area:sag;}
.yonerge{flex:0 1 auto;max-height:55%;}
.yonerge .icerik{padding:0.7rem 0.85rem;display:flex;flex-direction:column;gap:0.5rem;}
.cip{align-self:flex-start;font-size:0.9rem;font-weight:700;padding:0.15rem 0.6rem;border-radius:1rem;background:var(--lacivert);color:#fff;}
.yonerge h1{font-size:1.3rem;color:var(--lacivert);}
.yonerge .metin{font-size:1.12rem;}
.kavram-not{font-size:0.98rem;color:var(--ikincil);border-left:0.25rem solid var(--vurgu);padding-left:0.5rem;}
.ipucu-liste{margin:0;padding-left:1.2rem;display:flex;flex-direction:column;gap:0.35rem;font-size:1.05rem;}
.palet{flex:1 1 auto;}
.palet .icerik{padding:0.6rem;display:flex;flex-direction:column;gap:0.45rem;}
.palet-not{font-size:0.95rem;color:var(--ikincil);}
.komut{width:100%;min-height:44px;text-align:left;border-radius:0.6rem;border:0.12rem solid var(--k);border-left-width:0.55rem;background:var(--t);
  padding:0.45rem 0.6rem;display:flex;align-items:center;gap:0.5rem;font-size:1.05rem;}
.komut svg{width:1.4rem;height:1.4rem;flex:0 0 auto;color:var(--k);}

.sp{position:absolute;width:320px;height:384px;background-size:100% 100%;background-repeat:no-repeat;pointer-events:none;}
.etiket-izo{position:absolute;transform:translate(-50%,-50%);background:#fff;color:var(--metin);border:5px solid #24384d;border-radius:18px;
  padding:2px 16px;font-size:42px;font-weight:700;line-height:1.15;white-space:nowrap;pointer-events:none;}
.harf-izo{position:absolute;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;background:#fff;color:var(--metin);border:5px solid #24384d;
  font-size:44px;font-weight:700;display:flex;align-items:center;justify-content:center;pointer-events:none;line-height:1;}
.yigin-izo{position:absolute;margin:-30px 0 0 30px;min-width:60px;height:52px;border-radius:26px;background:var(--lacivert);color:#fff;font-size:36px;font-weight:700;
  display:flex;align-items:center;justify-content:center;padding:0 10px;pointer-events:none;}
.arac-izo{transition:left .32s ease,top .32s ease;}
.arac-izo .yuk-rozet{position:absolute;left:200px;top:110px;min-width:66px;height:66px;border-radius:33px;background:var(--vurgu);color:#fff;font-weight:700;font-size:40px;
  display:flex;align-items:center;justify-content:center;padding:0 12px;border:5px solid #fff;}
.arac-izo.sars{animation:sars .45s ease;}
@keyframes sars{0%,100%{margin-left:0;}25%{margin-left:-22px;}75%{margin-left:22px;}}
button.hucre{position:absolute;padding:0;margin:0;border:0;background:rgba(255,255,255,0);cursor:pointer;z-index:2000;
  -webkit-clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);}
button.hucre:hover{background:rgba(217,105,42,.22);}
button.hucre:focus-visible{outline:none;background:rgba(217,105,42,.45);}
.tahmin-izo{position:absolute;pointer-events:none;z-index:1900;}
.basari-afis{position:relative;flex:0 0 auto;align-self:center;margin:0.2rem auto 0.4rem;z-index:5;background:#fff;border:0.18rem solid var(--basari);border-radius:var(--r);
  padding:0.6rem 1rem;box-shadow:var(--golge);display:flex;align-items:center;gap:0.6rem;max-width:92%;font-size:1.1rem;font-weight:400;}
.basari-afis svg{width:2rem;height:2rem;color:var(--basari);flex:0 0 auto;}
.sirala-sahne .basari-afis{position:absolute;left:50%;top:0.4rem;transform:translateX(-50%);margin:0;}
.basari-afis.kotu{border-color:var(--hata);} .basari-afis.kotu svg{color:var(--hata);}
.kontroller{display:flex;flex-wrap:wrap;gap:0.45rem;justify-content:center;padding:0.5rem;border-top:0.1rem solid var(--cizgi);flex:0 0 auto;}

.alan-sag .liste{flex:1 1 auto;padding:0.55rem;display:flex;flex-direction:column;gap:0.3rem;}
.prog-arac{display:flex;gap:0.35rem;flex-wrap:wrap;padding:0.45rem 0.55rem;border-bottom:0.1rem solid var(--cizgi);flex:0 0 auto;}
.prog-arac{flex-wrap:nowrap;}
.prog-arac .dugme{flex:1 1 0;min-width:44px;padding:0.35rem 0.4rem;font-size:0.95rem;}
.panel-baslik #blokSayac{margin-left:auto;}
.panel-baslik .dugme{padding:0.3rem 0.6rem;font-size:0.92rem;}
.satir{display:flex;flex-wrap:wrap;align-items:stretch;gap:0.3rem;min-width:0;}
.satir .blok{flex:1 1 7.5rem;}
.blok{flex:1 1 auto;min-width:0;min-height:44px;text-align:left;border-radius:0.55rem;border:0.12rem solid var(--k);border-left-width:0.5rem;background:var(--t);
  padding:0.35rem 0.55rem;display:flex;align-items:center;gap:0.45rem;font-size:1.02rem;position:relative;}
.blok svg{width:1.25rem;height:1.25rem;color:var(--k);flex:0 0 auto;}
.blok span{min-width:0;overflow-wrap:break-word;}
.ok-isareti{font-family:Arial,Helvetica,sans-serif;font-size:1.25em;font-weight:700;line-height:1;}
.blok[aria-pressed="true"]{box-shadow:0 0 0 0.2rem var(--vurgu);}
.secili-altina::after{content:"";position:absolute;left:0.6rem;right:0.6rem;bottom:-0.32rem;height:0.22rem;border-radius:0.2rem;background:var(--vurgu);}
.blok.aktif{background:#fff6c9;border-color:#a8890b;}
.blok.aktif svg{color:#7a6305;}
.blok.hatali{background:#fde3e0;border-color:var(--hata);}
.sayi-ayar{display:inline-flex;align-items:center;gap:0.15rem;flex:0 0 auto;}
.kucuk{min-width:44px;min-height:44px;border-radius:0.5rem;border:0.12rem solid var(--k-dongu);background:#fff;font-size:1.3rem;font-weight:700;padding:0;color:var(--k-dongu);}
.sayi-ayar output{min-width:1.8rem;text-align:center;font-size:1.15rem;font-weight:700;}
.ic{margin-left:clamp(0.6rem,1.6vw,1.2rem);padding-left:0.45rem;border-left:0.25rem solid var(--k);display:flex;flex-direction:column;gap:0.3rem;padding-top:0.1rem;padding-bottom:0.1rem;}
.yer-tutucu{width:100%;min-height:44px;border-radius:0.55rem;border:0.13rem dashed #8b97a6;background:#fafafa;color:var(--ikincil);font-size:0.98rem;text-align:left;padding:0.3rem 0.6rem;}
.yer-tutucu[aria-pressed="true"]{border-color:var(--vurgu);border-style:solid;background:#fff3e8;color:var(--metin);}
.salt-okunur .blok{cursor:default;}

.tahmin-kutu{display:flex;flex-direction:column;gap:0.55rem;padding:0.7rem;}
.tahmin-kutu p{font-size:1.08rem;}
.tahmin-sayi{display:flex;align-items:center;gap:0.5rem;}
.tahmin-sayi output{font-size:2rem;font-weight:700;min-width:3rem;text-align:center;}
.tahmin-sayi .kucuk{border-color:var(--lacivert);color:var(--lacivert);}

/* ---------- Sıralama ---------- */
.sirala-sahne{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;padding:0.6rem 0.8rem 0.4rem;position:relative;}
.raf{display:flex;align-items:flex-end;justify-content:center;gap:clamp(0.25rem,1vw,0.8rem);height:100%;min-height:0;border-bottom:0.35rem solid #8a7f6c;padding-top:2.6rem;}
.kutu-sutun{flex:1 1 0;max-width:7rem;min-width:0;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-end;height:100%;position:relative;}
.kutu-sutun .yuk{border-radius:0.45rem 0.45rem 0 0;border:0.14rem solid #2c4a63;background:var(--kr);
  background-image:repeating-linear-gradient(90deg,transparent 0 16%,rgba(255,255,255,.22) 16% 19%);
  display:flex;align-items:flex-start;justify-content:center;padding:0.35rem 0.2rem 0;transition:height .3s ease;min-height:3.2rem;}
.kutu-sutun .yuk b{background:#fff;color:var(--metin);border-radius:0.45rem;padding:0.1rem 0.45rem;font-weight:700;font-size:clamp(1.1rem,2.2vw,1.9rem);
  line-height:1.15;white-space:nowrap;border:0.12rem solid #2c4a63;}
.kutu-sutun .yuk b small{font-size:0.55em;font-weight:400;margin-left:0.15rem;}
.kutu-sutun .etiket{text-align:center;font-size:0.95rem;padding-top:0.2rem;min-height:1.5rem;}
.kutu-sutun.cift .yuk{box-shadow:0 0 0 0.25rem var(--vurgu);}
.kutu-sutun.yerinde .yuk{border-color:var(--basari);border-width:0.22rem;}
.kutu-sutun .kanca{position:absolute;left:0;right:0;top:-2.5rem;height:2.3rem;display:flex;justify-content:center;pointer-events:none;}
.kutu-sutun .kanca svg{height:100%;width:auto;}
.sayac-satiri{display:flex;flex-wrap:wrap;gap:0.4rem 1.2rem;padding:0.5rem 0.8rem;border-bottom:0.1rem solid var(--cizgi);font-size:1.05rem;}
.sayac-satiri b{font-weight:700;}
.sirala-yan .icerik{padding:0.7rem;display:flex;flex-direction:column;gap:0.6rem;}
.sirala-yan .dugme{width:100%;}
.kural{font-size:1.15rem;font-weight:400;background:#fff3e8;border-left:0.3rem solid var(--vurgu);padding:0.5rem 0.6rem;border-radius:0.4rem;}

/* ---------- Bitiş ---------- */
.bitis{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:0.9rem;padding:1rem;}
.bitis h1{font-size:clamp(1.8rem,3.4vw,2.8rem);color:var(--lacivert);}
.bitis p{font-size:1.25rem;}
.bitis svg{width:clamp(5rem,14vw,9rem);height:auto;}

/* ---------- Duyarlı yerleşim ---------- */
@media (max-width: 900px){
  .gorev{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,1.1fr) minmax(0,1fr);grid-template-areas:"orta orta" "sol sag";}
  .yonerge{max-height:50%;}
  .giris{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);align-items:start;}
  .giris-gorsel img{max-height:34vh;}
}
@media (max-width: 768px){
  .ust-baslik span{display:none;}
  .bolumler-dugme .yazi{display:none;}
  .gezinti{padding:0.4rem 0.8rem;}
  .yonerge .metin{font-size:1.02rem;}
  .komut,.blok{font-size:0.98rem;}
}
@media (max-width: 480px){
  html{font-size:calc(15px * var(--olcek));}
  .ust{gap:0.35rem;}
  .arac-cubugu{gap:0.2rem;}
  .ust-dugme{width:44px;height:44px;}
  .ust-baslik strong{font-size:1rem;}
  .gezinti .yazi{display:none;}
  #durum{font-size:0.92rem;}
  .gorev{grid-template-rows:minmax(0,1fr) minmax(0,1fr);grid-template-columns:minmax(0,0.85fr) minmax(0,1.15fr);}
  .panel-baslik{padding:0.35rem 0.5rem;}
  .palet .icerik,.alan-sag .liste{padding:0.35rem;}
  .komut svg,.blok svg{display:none;}
  .ic{margin-left:0.35rem;padding-left:0.3rem;}
  .kontroller{gap:0.3rem;padding:0.35rem;}
  .kontroller .dugme .yazi{display:none;}
  .prog-arac .dugme .yazi,.panel-baslik .dugme .yazi{display:none;}
  .giris-metin p{font-size:1.05rem;}
}
@media (max-height: 500px){
  html{font-size:calc(14px * var(--olcek));}
  .ust,.alt{padding-top:0.2rem;padding-bottom:0.2rem;}
  .ust-baslik span{display:none;}
  .gorev{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr);grid-template-areas:"sol orta sag";}
  .yonerge{max-height:45%;}
  .kontroller{padding:0.25rem;gap:0.3rem;}

  /* =========================================================
     4. Program ağacı
     ========================================================= */
  var sonId = 0;
  function yeniId() { sonId += 1; return 'n' + sonId; }
  function dugumKur(anahtar) {
    var k = KOMUT[anahtar];
    var n = { id: yeniId(), t: k.t || anahtar };
    if (k.k) n.k = k.k;
    if (anahtar === 'tekrar') n.n = 3;
    if (k.kap) n.ic = [];
    return n;
  }
  function programKur(spec) {
    return spec.map(function (s) {
      if (typeof s === 'string') return dugumKur(s);
      var n = dugumKur(s[0]);
      if (s[0] === 'tekrar') { n.n = s[1]; n.ic = programKur(s[2]); }
      else { n.ic = programKur(s[1]); }
      return n;
    });
  }
  function kopyala(liste) {
    return liste.map(function (n) {
      var c = { id: yeniId(), t: n.t };
      if (n.k) c.k = n.k;
      if (n.n !== undefined) c.n = n.n;
      if (n.ic) c.ic = kopyala(n.ic);
      return c;
    });
  }
  function blokSayisi(liste) {
    var s = 0;
    liste.forEach(function (n) { s += 1; if (n.ic) s += blokSayisi(n.ic); });
    return s;
  }
  /* id → {liste, indeks, ebeveyn} */
  function bul(liste, id, ebeveyn) {
    for (var i = 0; i < liste.length; i++) {
      if (liste[i].id === id) return { liste: liste, indeks: i, ebeveyn: ebeveyn || null };
      if (liste[i].ic) {
        var r = bul(liste[i].ic, id, liste[i]);
        if (r) return r;
      }
    }
    return null;
  }
  function ebeveynBul(kok, ebeveyn) {
    if (!ebeveyn) return null;
    return bul(kok, ebeveyn.id, null);
  }

  /* =========================================================
     5. Dünya ve yorumlayıcı
     ========================================================= */
  var DX = [1, 0, -1, 0], DY = [0, 1, 0, -1];
  var YON_ADI = ['doğu', 'güney', 'batı', 'kuzey'];

  function dunyaCoz(tanim) {
    var h = tanim.harita, H = h.length, W = h[0].length;
    var hucre = [], kon = {}, x0 = 0, y0 = 0;
    for (var y = 0; y < H; y++) {
      var satir = [];
      for (var x = 0; x < W; x++) {
        var c = h[y].charAt(x), tip = 'rihtim';
        if (c === '~') tip = 'su';
        else if (c === 'E') tip = 'cikis';
        else if (c === 'D') tip = 'depo';
        else if (c === 'A') { x0 = x; y0 = y; }
        else if (RENK[c]) kon[x + ',' + y] = [c];
        satir.push(tip);
      }
      hucre.push(satir);
    }
    return { W: W, H: H, hucre: hucre, kon: kon, x0: x0, y0: y0, yon0: tanim.yon || 0 };
  }
  function ilkDurum(dn) {
    var kon = {};
    Object.keys(dn.kon).forEach(function (k) { kon[k] = dn.kon[k].slice(); });
    return { x: dn.x0, y: dn.y0, yon: dn.yon0, aci: dn.yon0 * 90, yuk: [], kon: kon, deg: {} };
  }
  function durumKopya(d) {
    var kon = {};
    Object.keys(d.kon).forEach(function (k) { kon[k] = d.kon[k].slice(); });
    var deg = {};
    Object.keys(d.deg).forEach(function (k) { deg[k] = d.deg[k]; });
    return { x: d.x, y: d.y, yon: d.yon, aci: d.aci, yuk: d.yuk.slice(), kon: kon, deg: deg };
  }
  var HATA_METNI = {
    su: 'Araç denize girecekti. Araç durduruldu.',
    disari: 'Araç rıhtımın dışına çıkacaktı.',
    bos: 'Bu karede alınacak konteyner yok.',
    yukyok: 'Araçta bırakılacak konteyner yok.',
    sonsuz: 'Döngü hiç bitmedi. Araç durduruldu.',
    tanimsiz: 'Sayaç henüz bir değer almadı.'
  };
  var ADIM_SINIRI = 400;

  function yorumla(prog, dn) {
    var d = ilkDurum(dn), adimlar = [], hata = null;
    function kaydet(blok, olay, ek) {
      adimlar.push({ blok: blok, olay: olay, ek: ek || null, d: durumKopya(d) });
      if (adimlar.length > ADIM_SINIRI) throw { kod: 'sonsuz', blok: blok };
    }
    function anahtar() { return d.x + ',' + d.y; }
    function kosul(k) {
      var s = d.kon[anahtar()];
      if (k === 'kirmizi') return !!(s && s.length && s[s.length - 1] === 'k');
      if (k === 'konteyner') return !!(s && s.length);
      if (k === 'cikis') return dn.hucre[d.y][d.x] === 'cikis';
      return false;
    }
    function calis(liste) {
      for (var i = 0; i < liste.length; i++) {
        var n = liste[i];
        if (n.t === 'ileri') {
          var nx = d.x + DX[d.yon], ny = d.y + DY[d.yon];
          if (nx < 0 || ny < 0 || nx >= dn.W || ny >= dn.H) throw { kod: 'disari', blok: n.id };
          if (dn.hucre[ny][nx] === 'su') throw { kod: 'su', blok: n.id };
          d.x = nx; d.y = ny; kaydet(n.id, 'hareket');
        } else if (n.t === 'sag') {
          d.yon = (d.yon + 1) % 4; d.aci += 90; kaydet(n.id, 'don');
        } else if (n.t === 'sol') {
          d.yon = (d.yon + 3) % 4; d.aci -= 90; kaydet(n.id, 'don');
        } else if (n.t === 'al') {
          var s = d.kon[anahtar()];
          if (!s || !s.length) throw { kod: 'bos', blok: n.id };
          d.yuk.push(s.pop()); if (!s.length) delete d.kon[anahtar()];
          kaydet(n.id, 'al');
        } else if (n.t === 'birak') {
          if (!d.yuk.length) throw { kod: 'yukyok', blok: n.id };
          var a = anahtar(); if (!d.kon[a]) d.kon[a] = [];
          d.kon[a].push(d.yuk.pop()); kaydet(n.id, 'birak');
        } else if (n.t === 'ata0') {
          d.deg.sayac = 0; kaydet(n.id, 'ata');
        } else if (n.t === 'artir') {
          if (d.deg.sayac === undefined) throw { kod: 'tanimsiz', blok: n.id };
          d.deg.sayac += 1; kaydet(n.id, 'ata');
        } else if (n.t === 'tekrar') {
          for (var t = 0; t < n.n; t++) { kaydet(n.id, 'tur', { i: t + 1, n: n.n }); calis(n.ic); }
        } else if (n.t === 'eger') {
          var v = kosul(n.k); kaydet(n.id, 'kontrol', { sonuc: v });
          if (v) calis(n.ic);
        } else if (n.t === 'kadar') {
          for (;;) {
            var v2 = kosul(n.k); kaydet(n.id, 'kontrol', { sonuc: v2 });
            if (v2) break;
            calis(n.ic);
          }
        }
      }
    }
    try { calis(prog); }
    catch (e) {
      if (e && e.kod) { hata = e; adimlar.push({ blok: e.blok, olay: 'hata', ek: e, d: durumKopya(d) }); }
      else throw e;
    }
    return { adimlar: adimlar, hata: hata, son: d };
  }

  function say(dn, renk) {
    var s = 0;
    Object.keys(dn.kon).forEach(function (k) { dn.kon[k].forEach(function (c) { if (!renk || c === renk) s++; }); });
    return s;
  }
  function hedefDenetle(g, dn, son) {
    var h = g.hedef;
    if (h.teslim) {
      if (son.yuk.length) return 'Araçta hâlâ konteyner var.';
      var top = say(dn), depoda = 0;
      Object.keys(son.kon).forEach(function (k) {
        var p = k.split(','); if (dn.hucre[+p[1]][+p[0]] === 'depo') depoda += son.kon[k].length;
      });
      if (depoda < top) return 'Konteyner depoya ulaşmadı.';
    }
    if (h.topla) {
      var yanlis = son.yuk.filter(function (c) { return c !== h.topla; }).length;
      if (yanlis) return 'Kırmızı olmayan konteyner de alındı.';
      if (son.yuk.length < say(dn, h.topla)) return 'Rıhtımda kırmızı konteyner kaldı.';
    }
    if (h.sayac) {
      var bek = say(dn, h.sayac === 'hepsi' ? null : h.sayac), gercek = son.deg.sayac;
      if (gercek === undefined) return 'Sayaç hiç değer almadı.';
      if (gercek !== bek) return 'Sayaç ' + bek + ' olmalıydı. Şimdi ' + gercek + '.';
    }
    if (h.cikis && dn.hucre[son.y][son.x] !== 'cikis') return 'Araç çıkış kapısında durmadı.';
    return null;
  }

    adim: function () { this.ton(520, 0.06, 'triangle'); },
    eylem: function () { this.ton(740, 0.09, 'triangle'); },
    basari: function () { this.ton(523, 0.14); this.ton(659, 0.14, 'sine', 0.12); this.ton(784, 0.22, 'sine', 0.24); },
    hata: function () { this.ton(196, 0.25, 'square'); }
  };

  /* =========================================================
     7. SCORM 1.2 (LMS yoksa sessizce devre dışı)
     ========================================================= */
  var Scorm = {
    api: null, baslangic: Date.now(), bitti: false,
    bul: function () {
      var w = window, n = 0;
      try {
        while (w && !w.API && w.parent && w.parent !== w && n < 12) { w = w.parent; n++; }
        if (w && w.API) return w.API;
        if (window.opener && window.opener.API) return window.opener.API;
      } catch (e) { return null; }
      return null;
    },
    baslat: function () {
      this.api = this.bul();
      if (!this.api) return null;
      try {
        this.api.LMSInitialize('');
        var st = this.api.LMSGetValue('cmi.core.lesson_status');
        if (st !== 'completed' && st !== 'passed') this.api.LMSSetValue('cmi.core.lesson_status', 'incomplete');
        var sd = this.api.LMSGetValue('cmi.suspend_data');
        return sd ? JSON.parse(sd) : null;
      } catch (e) { return null; }
    },
    kaydet: function (veri, tamamSay, toplam) {
      if (!this.api) return;
      try {
        this.api.LMSSetValue('cmi.suspend_data', JSON.stringify(veri));
        this.api.LMSSetValue('cmi.core.score.min', '0');
        this.api.LMSSetValue('cmi.core.score.max', '100');
        this.api.LMSSetValue('cmi.core.score.raw', String(Math.round(tamamSay / toplam * 100)));
        if (tamamSay >= toplam) this.api.LMSSetValue('cmi.core.lesson_status', 'completed');
        this.api.LMSCommit('');
      } catch (e) { /* sessiz */ }
    },
    kapat: function () {
      if (!this.api || this.bitti) return;
      this.bitti = true;
      try {
        var s = Math.floor((Date.now() - this.baslangic) / 1000);
        var hh = Math.floor(s / 3600), mm = Math.floor(s % 3600 / 60), ss = s % 60;
        function p(v) { return (v < 10 ? '0' : '') + v; }
        this.api.LMSSetValue('cmi.core.session_time', p(hh) + ':' + p(mm) + ':' + p(ss));
        this.api.LMSCommit(''); this.api.LMSFinish('');
      } catch (e) { /* sessiz */ }
    }
  };

  /* =========================================================
     8. Uygulama durumu
     ========================================================= */
  var DEPO_ANAHTARI = 'algoritmaLimani.v1';
  var OLCEKLER = [0.85, 1, 1.15, 1.3];

    ekran: 'giris', gorevNo: 0, tamam: {}, programlar: {}, olcekNo: 1,
    /* görev içi */
    prog: [], secim: null, dunyaNo: 0, iz: null, adimNo: -1, zamanlayici: null, calisiyor: false,
    ipucuNo: 0, tahminKare: null, tahminSayi: 0, dunyaSonuc: {}, sirala: null
  };

  function kaydetIlerleme() {
    var veri = { t: Object.keys(S.tamam), g: S.gorevNo, e: S.ekran === 'gorev' ? 'gorev' : S.ekran };
    try { window.localStorage.setItem(DEPO_ANAHTARI, JSON.stringify(veri)); } catch (e) { /* depolama yok */ }
    Scorm.kaydet(veri, Object.keys(S.tamam).length, SIRA.length);
  }
  function yukleIlerleme(scormVeri) {
    var veri = scormVeri;
    if (!veri) { try { veri = JSON.parse(window.localStorage.getItem(DEPO_ANAHTARI) || 'null'); } catch (e) { veri = null; } }
    if (!veri) return;
    (veri.t || []).forEach(function (id) { if (SIRA.some(function (g) { return g.id === id; })) S.tamam[id] = true; });
  }

  /* =========================================================
     9. Yardımcılar
     ========================================================= */
  var $ = function (id) { return document.getElementById(id); };
  function okluYazi(s) { return kac(s).replace('←', '<span class="ok-isareti" aria-hidden="true">←</span>'); }
  function kac(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function durumYaz(metin, tip) {
    var d = $('durum');
    d.className = tip || '';
    d.textContent = '';
    window.setTimeout(function () { d.textContent = metin || ''; }, 30);
  }
  function hizli() { return !!window.__FAST; }

  /* =========================================================
     10. Ekranlar ve gezinti
     ========================================================= */
  function ekranAc(ad, gorevNo) {
    durdur();
    S.ekran = ad;
    if (gorevNo !== undefined) S.gorevNo = gorevNo;
    $('ileriDugme').classList.remove('dikkat');

    else if (ad === 'gorev') gorevAc(m);
    else if (ad === 'bitis') bitisCiz(m);
    ustBilgi();

    if (odak) { odak.setAttribute('tabindex', '-1'); try { odak.focus({ preventScroll: true }); } catch (e) { odak.focus(); } }
  }
  function ustBilgi() {
    var b = $('ustBaslik'), a = $('ustAlt');
    if (S.ekran === 'gorev') {
      var g = SIRA[S.gorevNo];
      b.textContent = (g.bi + 1) + '. Bölüm: ' + g.bolum.ad;
      a.textContent = 'Görev ' + (g.gi + 1) + ' / ' + g.bolum.gorevler.length + ' · ' + g.baslik;
    } else {
      b.textContent = 'Algoritma Limanı';

    }
  }
  function gezintiGuncelle() {
    var geri = $('geriDugme');
    geri.disabled = S.ekran === 'giris';

    if (S.ekran === 'gorev' && S.gorevNo === SIRA.length - 1) etiket = 'Bitir';
    $('ileriDugme').querySelector('.yazi').textContent = etiket;
    $('ileriDugme').setAttribute('aria-label', etiket);

  }
  function ilkEksik() {
    for (var i = 0; i < SIRA.length; i++) if (!S.tamam[SIRA[i].id]) return i;
    return 0;
  }
  function ileri() {
    if (S.ekran === 'giris') ekranAc('harita');
    else if (S.ekran === 'harita') ekranAc('gorev', ilkEksik());
    else if (S.ekran === 'gorev') {
      if (S.gorevNo < SIRA.length - 1) ekranAc('gorev', S.gorevNo + 1);

    }
  }
  function geri() {
    if (S.ekran === 'harita') ekranAc('giris');
    else if (S.ekran === 'gorev') {
      if (S.gorevNo > 0) ekranAc('gorev', S.gorevNo - 1);
      else ekranAc('harita');

  /* ---------- Giriş ---------- */

  /* ---------- Bölüm haritası ---------- */
  function haritaCiz(m) {
    var h = '<section class="harita" aria-labelledby="haritaBaslik"><h1 id="haritaBaslik">Bölümler</h1>' +
      '<div class="bolum-izgara kaydir">';
    BOLUMLER.forEach(function (b, bi) {
      var tamamSay = b.gorevler.filter(function (g) { return S.tamam[g.id]; }).length;

  /* =========================================================

  function gorevAc(m) {
    var g = SIRA[S.gorevNo];
    S.ipucuNo = 0; S.dunyaNo = 0; S.iz = null; S.adimNo = -1; S.tahminKare = null; S.tahminSayi = 0; S.tahminYapildi = false; S.dunyaSonuc = {};

    if (S.programlar[g.id]) S.prog = S.programlar[g.id];
    else {
      if (g.baslangic === 'onceki') {
        var onceki = SIRA[g.no - 1];
        S.prog = onceki && S.programlar[onceki.id] && S.programlar[onceki.id].length ? kopyala(S.programlar[onceki.id]) : [];
      } else S.prog = programKur(g.baslangic);
      S.programlar[g.id] = S.prog;
    }
    S.secim = S.prog.length ? { tip: 'blok', id: S.prog[S.prog.length - 1].id } : { tip: 'ic', id: 'kok' };

    var cokDunya = g.dunyalar.length > 1;

    m.innerHTML =
      '<section class="gorev" aria-labelledby="gorevBaslik">' +
        '<div class="alan-sol">' +
          '<div class="panel yonerge"><div class="kaydir"><div class="icerik">' +
            '<span class="cip">' + TUR_ADI[g.tur] + '</span>' +
            '<h1 id="gorevBaslik">' + kac(g.baslik) + '</h1>' +
            '<p class="metin">' + kac(g.yonerge) + '</p>' +

            '<button type="button" class="dugme" id="ipucuDugme">' + I.ipucu + '<span>İpucu</span></button>' +
          '</div></div></div>' +
          solAlt +
        '</div>' +
        '<div class="panel alan-orta">' +
          (cokDunya ? '<div class="sekmeler" role="tablist" aria-label="Rıhtımlar">' + g.dunyalar.map(function (d, i) {
            return '<button type="button" class="sekme" role="tab" id="sekme' + i + '" data-dunya="' + i + '" aria-selected="' + (i === 0) + '" tabindex="' + (i === 0 ? 0 : -1) + '" aria-controls="sahneKutu">' +

          var n = g.dunyalar.length, i = (S.dunyaNo + (e.key === 'ArrowRight' ? 1 : n - 1)) % n;

    if (S.ro) S.ro.observe($('sahneKutu'));
    if (S.tamam[g.id]) durumYaz('Bu görevi daha önce tamamladınız.', 'iyi');
    else durumYaz(g.salt ? 'Önce tahmininizi yapınız.' : 'Komutlara dokunarak kodunuzu kurunuz.');

  function ipucuGoster() {
    var g = SIRA[S.gorevNo];
    if (S.ipucuNo >= g.ipuclari.length) { durumYaz('Bütün ipuçlarını gördünüz.'); return; }
    var li = document.createElement('li');
    li.textContent = g.ipuclari[S.ipucuNo];
    $('ipucuListe').appendChild(li);
    S.ipucuNo += 1;
    if (S.ipucuNo >= g.ipuclari.length) $('ipucuDugme').disabled = true;
  }

  /* ---------- Program düzenleyici ---------- */
  function programCiz() {
    var g = SIRA[S.gorevNo], kutu = $('programListe');
    if (!kutu) return;
    var aktif = S.iz && S.adimNo >= 0 && S.iz.adimlar[S.adimNo] ? S.iz.adimlar[S.adimNo] : null;
    var aktifId = aktif ? aktif.blok : null, hataliMi = aktif && aktif.olay === 'hata';
    function satirlar(liste) {
      var h = '';
      liste.forEach(function (n) {
        var a = komutAnahtari(n), k = KOMUT[a];
        var secili = !g.salt && S.secim && S.secim.tip === 'blok' && S.secim.id === n.id;
        var yazi = n.t === 'tekrar' ? n.n + ' kez tekrarla' : k.yazi;
        var aria = n.t === 'tekrar' ? n.n + ' kez tekrarla' : (k.aria || k.yazi);
        var sinif = 'blok kat-' + k.kat + (n.id === aktifId ? (hataliMi ? ' hatali' : ' aktif') : '') + (secili ? ' secili-altina' : '');
        h += '<div class="satir">';
        if (g.salt) h += '<div class="' + sinif + '">' + I[k.ikon] + '<span>' + okluYazi(yazi) + '</span>' + (n.id === aktifId ? '<span class="gizli">, şu an çalışıyor</span>' : '') + '</div>';
        else h += '<button type="button" class="' + sinif + '" data-blok="' + n.id + '" aria-pressed="' + secili + '"' +
          ' aria-label="' + kac(aria) + (n.id === aktifId ? ', şu an çalışıyor' : '') + '">' + I[k.ikon] + '<span>' + kac(yazi) + '</span></button>';
        if (n.t === 'tekrar' && !g.salt) {
          h += '<span class="sayi-ayar"><button type="button" class="kucuk" data-azalt="' + n.id + '" aria-label="Tekrar sayısını azalt">−</button>' +
               '<button type="button" class="kucuk" data-artir="' + n.id + '" aria-label="Tekrar sayısını artır">+</button></span>';
        }
        h += '</div>';

    if (a.olay === 'birak') return 'Konteyner bırakıldı.';
    if (a.olay === 'ata') return 'sayaç = ' + a.d.deg.sayac;
    return '';
  }
  function durdur() {
    if (S.zamanlayici) { window.clearTimeout(S.zamanlayici); S.zamanlayici = null; }
    if (S.calisiyor) { S.calisiyor = false; calistirDugmesiDurum(); }
  }
  function bitir() {
    S.calisiyor = false;
    if (S.zamanlayici) { window.clearTimeout(S.zamanlayici); S.zamanlayici = null; }
    calistirDugmesiDurum();
    var g = SIRA[S.gorevNo], iz = S.iz, son = iz.adimlar.length ? iz.adimlar[iz.adimlar.length - 1].d : ilkDurum(S.izDunya);
    sahneCiz(S.izDunya, son, true);
    programCiz();
    if (iz.hata) {
      var arac = $('arac'); arac.classList.remove('sars'); void arac.offsetWidth; arac.classList.add('sars');
      sonucBildir(false, HATA_METNI[iz.hata.kod] || 'Bir hata oluştu.');
      if (g.dunyalar.length > 1) { S.dunyaSonuc[S.dunyaNo] = false; sekmeIsaretleri(); }
      return;
    }
    // Tahmin görevleri
    if (g.tahmin === 'kare') {
      var dogru = S.tahminKare && S.tahminKare.x === son.x && S.tahminKare.y === son.y;
      if (dogru) gorevTamam(g.basari);
      else {
        sonucBildir(false, 'Tahmininiz tutmadı. Aracın durduğu kareye bakınız.');
        $('sahne').setAttribute('aria-label', $('sahne').getAttribute('aria-label') + ' Tahmininiz başka bir kareydi.');
        if ($('tahminBilgi')) $('tahminBilgi').textContent = 'Yeniden tahmin etmek için Başa al düğmesine dokununuz.';
      }
      return;
    }
    if (g.tahmin === 'sayi') {
      var deger = son.deg.sayac === undefined ? 0 : son.deg.sayac;
      if (deger === S.tahminSayi) gorevTamam(g.basari);
      else sonucBildir(false, 'Tahmininiz ' + S.tahminSayi + ' idi. Sayaç ' + deger + ' oldu. Kodu yeniden okuyunuz.');
      return;
    }
    // Hedef denetimi
    var sorun = hedefDenetle(g, S.izDunya, son);
    if (sorun) {
      sonucBildir(false, sorun);
      if (g.dunyalar.length > 1) { S.dunyaSonuc[S.dunyaNo] = false; sekmeIsaretleri(); }
      return;
    }
    if (g.enCokBlok && blokSayisi(S.prog) > g.enCokBlok) {
      sonucBildir(false, 'İş tamam ama kod uzun. En çok ' + g.enCokBlok + ' blok kullanınız.');
      return;
    }
    if (g.dunyalar.length > 1) {
      S.dunyaSonuc[S.dunyaNo] = true;
      for (var i = 0; i < g.dunyalar.length; i++) {
        if (i === S.dunyaNo) continue;
        var dn = dunyaCoz(g.dunyalar[i]), r = yorumla(S.prog, dn);
        var ok = !r.hata && !hedefDenetle(g, dn, r.son);
        S.dunyaSonuc[i] = ok;
      }
      sekmeIsaretleri();
      var hatali = -1;
      for (var j = 0; j < g.dunyalar.length; j++) if (!S.dunyaSonuc[j]) { hatali = j; break; }
      if (hatali >= 0) {
        var ad = g.dunyalar[hatali].ad;
        sonucBildir(false, 'Kod burada çalıştı. ' + ad + 'da çalışmadı. O sekmeyi deneyiniz.');
        return;
      }
    }
    gorevTamam(g.basari);
  }
  function sonucBildir(iyi, metin) {
    var a = $('afis');
    a.className = 'basari-afis' + (iyi ? '' : ' kotu');
    a.innerHTML = (iyi ? I.tamam : I.uyari) + '<span>' + kac(metin) + '</span>';
    a.hidden = false;
    a.setAttribute('aria-hidden', 'true');
    durumYaz(metin, iyi ? 'iyi' : 'kotu');
    if (iyi) Ses.basari(); else Ses.hata();
  }
  function afisGizle() { var a = $('afis'); if (a) a.hidden = true; }
  function gorevTamam(metin) {
    var g = SIRA[S.gorevNo];
    S.tamam[g.id] = true;
    kaydetIlerleme();
    sonucBildir(true, 'Görev tamam! ' + metin);
    $('ileriDugme').classList.add('dikkat');
  }

  /* =========================================================
     12. Sıralama atölyesi
     ========================================================= */
  var SIRA_RENK = ['#2f6fb3', '#a3471f', '#2f7a42', '#6b4fa0', '#1d6f5f', '#8a5a12'];
  function siralaAc(m, g) {
    S.sirala = { dizi: g.dizi.slice(), renk: g.dizi.map(function (v, i) { return SIRA_RENK[i % SIRA_RENK.length]; }),
      i: 0, son: g.dizi.length, tur: 1, turDegisim: 0, sonTurDegisim: null, karsilastirma: 0, degisim: 0, bitti: false, adlar: g.dizi.map(function (v, i) { return i; }) };
    m.innerHTML =
      '<section class="gorev" aria-labelledby="gorevBaslik">' +
        '<div class="alan-sol">' +
          '<div class="panel yonerge"><div class="kaydir"><div class="icerik">' +
            '<span class="cip">' + TUR_ADI[g.tur] + '</span>' +
            '<h1 id="gorevBaslik">' + kac(g.baslik) + '</h1>' +
            '<p class="metin">' + kac(g.yonerge) + '</p>' +
            '<p class="kavram-not">' + kac(g.bolum.aciklama) + '</p>' +
            '<ol class="ipucu-liste" id="ipucuListe" aria-live="polite"></ol>' +
            '<button type="button" class="dugme" id="ipucuDugme">' + I.ipucu + '<span>İpucu</span></button>' +
          '</div></div></div>' +
          '<div class="panel palet sirala-yan"><div class="panel-baslik"><h2 id="kuralBaslik">Kural</h2></div><div class="kaydir" tabindex="0" role="region" aria-labelledby="kuralBaslik"><div class="icerik">' +
            '<p class="kural">Soldaki ağırsa yer değiştiriniz.</p>' +
            '<p>Değilse olduğu gibi bırakınız.</p>' +
            '<p>Vinç sonra bir sağa kayar.</p>' +
          '</div></div></div>' +
        '</div>' +
        '<div class="panel alan-orta">' +
          '<div class="sayac-satiri" aria-live="off" id="siraSayac"></div>' +
          '<div class="sirala-sahne" id="sahneKutu"><div class="raf" id="raf" role="img"></div>' +
            '<div class="basari-afis" id="afis" hidden></div></div>' +
        '</div>' +
        '<div class="panel alan-sag sirala-yan">' +
          '<div class="panel-baslik"><h2>Kararınız</h2></div>' +
          '<div class="kaydir"><div class="icerik">' +
            '<button type="button" class="dugme birincil" id="degistirDugme">' + I.degistir + '<span>Yer değiştir</span></button>' +
            '<button type="button" class="dugme" id="birakDugme">' + I.ileriOk + '<span>Olduğu gibi bırak</span></button>' +
            (g.bittiDugmesi ? '<button type="button" class="dugme" id="bittiDugme">' + I.bayrak + '<span>Sıralama bitti</span></button>' : '') +
            '<button type="button" class="dugme" id="yenidenDugme">' + I.basa + '<span>Baştan başla</span></button>' +
          '</div></div>' +
        '</div>' +
      '</section>';
    $('ipucuDugme').addEventListener('click', ipucuGoster);
    $('degistirDugme').addEventListener('click', function () { siralaKarar(true); });
    $('birakDugme').addEventListener('click', function () { siralaKarar(false); });
    $('yenidenDugme').addEventListener('click', function () { siralaAc($('ekran'), g); durumYaz('Baştan başladınız.'); });
    if (g.bittiDugmesi) $('bittiDugme').addEventListener('click', siralaBitti);
    siralaCiz();
    if (S.tamam[g.id]) durumYaz('Bu görevi daha önce tamamladınız.', 'iyi');
    else durumYaz('Vincin gösterdiği iki konteyneri karşılaştırınız.');
  }
  function siralaCiz() {
    var s = S.sirala, raf = $('raf'); if (!raf) return;
    var enBuyuk = Math.max.apply(null, s.dizi);
    var h = '';
    s.dizi.forEach(function (v, i) {
      var yerinde = i >= s.son;
      var cift = !s.bitti && (i === s.i || i === s.i + 1) && s.i + 1 < s.son;
      h += '<div class="kutu-sutun' + (yerinde ? ' yerinde' : '') + (cift ? ' cift' : '') + '">' +
        (cift ? '<div class="kanca">' + KANCA_SVG + '</div>' : '') +
        '<div class="yuk" style="--kr:' + s.renk[s.adlar[i]] + ';height:' + (28 + 62 * v / enBuyuk) + '%"><b>' + v + '<small>ton</small></b></div>' +
        '<div class="etiket">' + (yerinde ? 'Yerinde' : '') + '</div></div>';
    });
    raf.innerHTML = h;
    var siraliMetin = s.dizi.map(function (v, i) { return v + ' ton' + (i >= s.son ? ' yerinde' : ''); }).join(', ');
    raf.setAttribute('aria-label', 'Konteynerler soldan sağa: ' + siraliMetin + '.' +
      (!s.bitti && s.i + 1 < s.son ? ' Vinç ' + (s.i + 1) + '. ve ' + (s.i + 2) + '. konteyneri gösteriyor.' : ''));
    $('siraSayac').innerHTML = '<span>Tur: <b>' + s.tur + '</b></span><span>Karşılaştırma: <b>' + s.karsilastirma + '</b></span>' +
      '<span>Yer değiştirme: <b>' + s.degisim + '</b></span>';
    var kapali = s.bitti || s.i + 1 >= s.son;
    $('degistirDugme').disabled = kapali; $('birakDugme').disabled = kapali;
  }
  function siralaKarar(degistir) {
    Ses.hazirla();
    var s = S.sirala, g = SIRA[S.gorevNo];
    if (s.bitti || s.i + 1 >= s.son) return;
    var sol = s.dizi[s.i], sag = s.dizi[s.i + 1];
    if (degistir && sol <= sag) { durumYaz('Soldaki daha hafif. Yer değiştirmeyiniz.', 'kotu'); Ses.hata(); return; }
    if (!degistir && sol > sag) { durumYaz('Soldaki daha ağır. Yer değiştiriniz.', 'kotu'); Ses.hata(); return; }
    s.karsilastirma++;
    if (degistir) {
      s.dizi[s.i] = sag; s.dizi[s.i + 1] = sol;
      var a = s.adlar[s.i]; s.adlar[s.i] = s.adlar[s.i + 1]; s.adlar[s.i + 1] = a;
      s.degisim++; s.turDegisim++; Ses.eylem();
    } else Ses.adim();
    s.i++;
    var mesaj = degistir ? 'Yer değiştirdi.' : 'Olduğu gibi kaldı.';
    if (s.i + 1 >= s.son) {
      s.son--;
      s.sonTurDegisim = s.turDegisim;
      mesaj = s.tur + '. tur bitti. En ağır konteyner sona yerleşti.';
      if (s.sonTurDegisim === 0) mesaj = s.tur + '. turda hiç yer değişmedi.';
      s.tur++; s.turDegisim = 0; s.i = 0;
      if (s.son <= 1) {
        s.son = 0;
        if (!g.bittiDugmesi) { s.bitti = true; siralaCiz(); siralaTamam(); return; }
        mesaj = 'Bütün konteynerler yerinde. Sıralama bitti düğmesine dokununuz.';
      }
    }
    siralaCiz();
    durumYaz(mesaj);
  }
  function siraliMi(d) { for (var i = 1; i < d.length; i++) if (d[i - 1] > d[i]) return false; return true; }
  function siralaBitti() {
    var s = S.sirala;
    if (!siraliMi(s.dizi)) { durumYaz('Henüz sıralı değil. Devam ediniz.', 'kotu'); Ses.hata(); return; }
    s.bitti = true; siralaCiz();
    siralaTamam(s.sonTurDegisim === 0 ? null : 'Liste sıralı. Değişmeyen bir tur bunu kesinleştirir.');
  }
  function siralaTamam(ek) {
    var g = SIRA[S.gorevNo], s = S.sirala;
    var metin = g.basari + ' ' + s.karsilastirma + ' karşılaştırma yaptınız.';
    if (ek) metin = ek + ' ' + s.karsilastirma + ' karşılaştırma yaptınız.';
    S.tamam[g.id] = true; kaydetIlerleme();
    sonucBildir(true, 'Görev tamam! ' + metin);
    $('ileriDugme').classList.add('dikkat');
  }

  /* =========================================================
     13. Üst araç çubuğu
     ========================================================= */
  function olcekUygula() {
    document.documentElement.style.setProperty('--olcek', OLCEKLER[S.olcekNo]);
    $('buyutDugme').disabled = S.olcekNo >= OLCEKLER.length - 1;
    $('kucultDugme').disabled = S.olcekNo <= 0;
    window.setTimeout(boyutla, 30);
  }
  function sesDugmesi() {
    var b = $('sesDugme');
    b.innerHTML = Ses.acik ? I.sesAcik : I.sesKapali;
    b.setAttribute('aria-label', Ses.acik ? 'Sesi kapat' : 'Sesi aç');
    b.setAttribute('aria-pressed', String(!Ses.acik));
  }
  function tamEkranda() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
  function tamEkranDugmesi() {
    var b = $('tamEkranDugme'), acik = tamEkranda();
    b.innerHTML = acik ? I.tamEkranCik : I.tamEkran;
    b.setAttribute('aria-label', acik ? 'Tam ekrandan çık' : 'Tam ekran');
    b.setAttribute('aria-pressed', String(acik));
  }
  function tamEkranDegistir() {
    var el = document.documentElement;
    try {
      if (tamEkranda()) {
        if (document.exitFullscreen) document.exitFullscreen(); else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      } else {
        var p = el.requestFullscreen ? el.requestFullscreen() : (el.webkitRequestFullscreen ? el.webkitRequestFullscreen() : null);
        if (p && p.catch) p.catch(function () { durumYaz('Tam ekran bu ortamda açılamıyor.'); });
        else if (!el.requestFullscreen && !el.webkitRequestFullscreen) durumYaz('Tam ekran bu ortamda açılamıyor.');
      }
    } catch (e) { durumYaz('Tam ekran bu ortamda açılamıyor.'); }
  }

  /* =========================================================
     14. Başlat
     ========================================================= */
  function baslat() {
    $('geriDugme').querySelector('.ikon-yer').outerHTML = I.geri;
    $('ileriDugme').querySelector('.ikon-yer').outerHTML = I.ileriOk;
    $('bolumlerDugme').querySelector('.ikon-yer').outerHTML = I.harita;
    $('bolumlerDugme').setAttribute('aria-label', 'Bölümler');
    $('buyutDugme').addEventListener('click', function () { if (S.olcekNo < OLCEKLER.length - 1) { S.olcekNo++; olcekUygula(); } });
    $('kucultDugme').addEventListener('click', function () { if (S.olcekNo > 0) { S.olcekNo--; olcekUygula(); } });
    $('sesDugme').addEventListener('click', function () { Ses.acik = !Ses.acik; Ses.hazirla(); sesDugmesi(); durumYaz(Ses.acik ? 'Ses açık.' : 'Ses kapalı.'); });
    $('tamEkranDugme').addEventListener('click', tamEkranDegistir);
    document.addEventListener('fullscreenchange', function () { tamEkranDugmesi(); window.setTimeout(boyutla, 60); });
    document.addEventListener('webkitfullscreenchange', function () { tamEkranDugmesi(); window.setTimeout(boyutla, 60); });
    $('bolumlerDugme').addEventListener('click', function () { ekranAc('harita'); });
    $('ileriDugme').addEventListener('click', function () { Ses.hazirla(); ileri(); });
    $('geriDugme').addEventListener('click', function () { Ses.hazirla(); geri(); });
    if (window.ResizeObserver) {
      S.ro = new ResizeObserver(function () { boyutla(); });
      S.ro.observe($('ekran'));
    }
    window.addEventListener('resize', boyutla);
    window.addEventListener('orientationchange', function () { window.setTimeout(boyutla, 120); });
    window.addEventListener('beforeunload', function () { Scorm.kapat(); });
    window.addEventListener('pagehide', function () { Scorm.kapat(); });
    sesDugmesi(); tamEkranDugmesi(); olcekUygula();
    yukleIlerleme(Scorm.baslat());
    ekranAc('giris');
  }

  /* Test kancası (yalnız otomatik testler kullanır) */
  window.__ALGO = {
    SIRA: SIRA, S: S,
    git: function (i) { ekranAc('gorev', i); },
    ekran: function (ad) { ekranAc(ad); },
    cozumYukle: function () {
      var g = SIRA[S.gorevNo];
      S.prog.length = 0; programKur(g.cozum).forEach(function (n) { S.prog.push(n); });
      S.secim = { tip: 'blok', id: S.prog[S.prog.length - 1].id }; programDegisti();
    },
    denetle: function (spec, dunyaNo) {
      var g = SIRA[S.gorevNo], dn = dunyaCoz(g.dunyalar[dunyaNo || 0]), r = yorumla(programKur(spec), dn);
      return { hata: r.hata ? r.hata.kod : null, sorun: r.hata ? null : hedefDenetle(g, dn, r.son), son: { x: r.son.x, y: r.son.y, sayac: r.son.deg.sayac } };
    },
    calistir: function () { calistirTikla(); },
    tahminKare: tahminKareSec,
    tahminSayi: function (n) { S.tahminSayi = n; S.tahminYapildi = true; calistirDurumu(); },
    sirala: function (d) { siralaKarar(d); },
    bitti: function () { siralaBitti(); }
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', baslat);
  else baslat();
})();
</script>
